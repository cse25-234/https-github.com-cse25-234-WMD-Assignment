<!DOCTYPE html>
<html lang="en">

<head>

    <title>Re-sponsorship Application</title>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<section id="main">

    <section id="header">

        <section id="logo">

            <section id="logo_text">

                <section id="menubar">

                    <ul id="menu">

                        <li><a href="index.html">Home</a></li>

                        <li><a href="about.html">About</a></li>

                        <li>
                            <a href="funding.html">
                                Funding Information
                            </a>
                        </li>

                        <li>
                            <a href="portal.html">
                                Student Portal
                            </a>
                        </li>

                        <li class="selected">
                            <a href="applications.html">
                                Applications
                            </a>
                        </li>

                    </ul>

                </section>

            </section>

        </section>

    </section>

    <section id="banner">

        <h1>RE-SPONSORSHIP</h1>

    </section>

    <section class="application-page">

        <h2>Apply for Re-sponsorship</h2>

        <p>
            Complete the form below to request
            re-sponsorship support.
        </p>

        <form class="application-form">

            <section>
                <label>Full Name</label>
                <input type="text" required>
            </section>

            <section>
                <label>Email Address</label>
                <input type="email" required>
            </section>

            <section>
                <label>Previous Institution</label>
                <input type="text">
            </section>

            <section>
                <label>Previous Programme</label>
                <input type="text">
            </section>

            <section>
                <label>Reason for Re-sponsorship</label>

                <textarea rows="5"></textarea>

            </section>

            <section>
                <label>New Programme</label>
                <input type="text">
            </section>

            <button type="submit">

                Submit Application

            </button>

        </form>

    </section>

</section>

</body>
</html>
