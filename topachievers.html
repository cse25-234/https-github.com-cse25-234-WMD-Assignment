<!DOCTYPE html>
<html lang="en">

<head>

    <title>Top Achievers Application</title>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<section id="main">

    <section id="header">

        <section id="logo">

            <section id="logo_text">

                <section id="menubar">

                    <ul id="menu">

                        <li><a href="index.html">Home</a></li>

                        <li><a href="about.html">About</a></li>

                        <li>
                            <a href="funding.html">
                                Funding Information
                            </a>
                        </li>

                        <li>
                            <a href="portal.html">
                                Student Portal
                            </a>
                        </li>

                        <li class="selected">
                            <a href="applications.html">
                                Applications
                            </a>
                        </li>

                    </ul>

                </section>

            </section>

        </section>

    </section>

    <section id="banner">

        <h1>TOP ACHIEVERS</h1>

    </section>

    <section class="application-page">

        <h2>Apply for Top Achievers</h2>

        <p>
            Complete the form below for international
            sponsorship consideration.
        </p>

        <form class="application-form">

            <section>
                <label>Full Name</label>
                <input type="text" required>
            </section>

            <section>
                <label>Email Address</label>
                <input type="email" required>
            </section>

            <section>
                <label>BGCSE/IGCSE Results</label>
                <input type="text" placeholder="Example: 6A*s">
            </section>

            <section>
                <label>A-Level/AS Results</label>
                <input type="text">
            </section>

            <section>
                <label>University Applied To</label>
                <input type="text">
            </section>

            <section>
                <label>Country of Study</label>
                <input type="text">
            </section>

            <button type="submit">

                Submit Application

            </button>

        </form>

    </section>

</section>

</body>
</html>
